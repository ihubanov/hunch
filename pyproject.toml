[project]
name = "hunch"
version = "1.0.0"
description = "Calibrated yes/no, pick-one and scale judgments from your own LLMs, read straight off the logprobs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
